<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-label="형님 6종 라인업 실루엣과 슬롯 순서">
<defs><linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0B1F3A"/><stop offset="1" stop-color="#061224"/></linearGradient>
<linearGradient id="pl" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1E54D6"/><stop offset="1" stop-color="#0B1F3A"/></linearGradient></defs>
<rect width="1600" height="700" fill="url(#bg)"/>
<g stroke="#7CC4FF" stroke-opacity=".08"><path d="M0 100H1600M0 200H1600M0 300H1600M0 400H1600M0 500H1600M0 600H1600"/><path d="M100 0V700M300 0V700M500 0V700M700 0V700M900 0V700M1100 0V700M1300 0V700M1500 0V700"/></g>
<text x="80" y="80" font-family="IBM Plex Mono, monospace" font-size="16" fill="#38E1FF" letter-spacing="5">BROTHERS · 6 SLOTS · atk0_i = 6 · 4^i</text>
<text x="80" y="125" font-family="Noto Serif KR, serif" font-weight="700" font-size="34" fill="#fff">형님 6종 — 슬롯 순서가 그리디 타이브레이크 순서다</text>
<!-- 6 pedestals with silhouettes scaling by slot -->
<g id="row" transform="translate(0 0)">
<!-- slot 0 -->
<g transform="translate(180 520)"><ellipse cx="0" cy="40" rx="90" ry="18" fill="url(#pl)"/><g fill="#EAF2FF"><rect x="-30" y="-110" width="60" height="120" rx="24"/><circle cx="0" cy="-130" r="28"/><rect x="-42" y="-122" width="84" height="20" rx="8"/><rect x="26" y="-100" width="12" height="110" rx="5" transform="rotate(-20 26 -100)"/></g><text x="0" y="80" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" fill="#7CC4FF">slot 0 · 큰형님</text><text x="0" y="102" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="13" fill="#A9BEDF">돌도끼 · atk0 6</text></g>
<!-- slot 1 -->
<g transform="translate(430 520)"><ellipse cx="0" cy="40" rx="95" ry="19" fill="url(#pl)"/><g fill="#DCE9FF"><rect x="-34" y="-120" width="68" height="130" rx="26"/><circle cx="0" cy="-142" r="30"/><rect x="-48" y="-134" width="96" height="22" rx="8"/><rect x="-60" y="-100" width="12" height="130" rx="5" transform="rotate(12 -60 -100)"/><rect x="-80" y="-108" width="40" height="14" rx="5" transform="rotate(12 -60 -100)"/></g><text x="0" y="80" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" fill="#7CC4FF">slot 1 · 둘째</text><text x="0" y="102" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="13" fill="#A9BEDF">뼈창 · atk0 24</text></g>
<!-- slot 2 -->
<g transform="translate(690 520)"><ellipse cx="0" cy="40" rx="100" ry="20" fill="url(#pl)"/><g fill="#C9DAF5"><rect x="-40" y="-130" width="80" height="140" rx="30"/><circle cx="0" cy="-154" r="33"/><rect x="-54" y="-146" width="108" height="24" rx="9"/><circle cx="58" cy="-80" r="34" fill="#7CC4FF"/><circle cx="58" cy="-80" r="20" fill="#0B1F3A"/></g><text x="0" y="80" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" fill="#7CC4FF">slot 2 · 셋째</text><text x="0" y="102" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="13" fill="#A9BEDF">방패 · atk0 96</text></g>
<!-- slot 3 -->
<g transform="translate(960 520)"><ellipse cx="0" cy="40" rx="105" ry="21" fill="url(#pl)"/><g fill="#B9CFF0"><rect x="-44" y="-140" width="88" height="150" rx="32"/><circle cx="0" cy="-166" r="36"/><rect x="-60" y="-158" width="120" height="26" rx="10"/><path d="M60 -150 C 110 -120, 110 -40, 60 -10" stroke="#B9CFF0" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M60 -150 L60 -10" stroke="#38E1FF" stroke-width="3"/></g><text x="0" y="80" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" fill="#7CC4FF">slot 3 · 넷째</text><text x="0" y="102" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="13" fill="#A9BEDF">활 · atk0 384</text></g>
<!-- slot 4 -->
<g transform="translate(1230 520)"><ellipse cx="0" cy="40" rx="110" ry="22" fill="url(#pl)"/><g fill="#A9C4EC"><rect x="-48" y="-150" width="96" height="160" rx="34"/><circle cx="0" cy="-178" r="38"/><rect x="-64" y="-170" width="128" height="28" rx="10"/><rect x="40" y="-200" width="16" height="210" rx="6"/><circle cx="48" cy="-206" r="18" fill="#38E1FF"/></g><text x="0" y="80" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" fill="#7CC4FF">slot 4 · 다섯째</text><text x="0" y="102" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="13" fill="#A9BEDF">주술 지팡이 · atk0 1,536</text></g>
<!-- slot 5 -->
<g transform="translate(1480 520)"><ellipse cx="0" cy="40" rx="100" ry="22" fill="url(#pl)"/><g fill="#8FB3E6"><rect x="-52" y="-160" width="104" height="170" rx="36"/><circle cx="0" cy="-190" r="40"/><rect x="-70" y="-182" width="140" height="30" rx="11"/><rect x="-96" y="-120" width="40" height="120" rx="14" transform="rotate(25 -96 -120)"/></g><text x="0" y="80" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" fill="#7CC4FF">slot 5 · 막내(?)</text><text x="0" y="102" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="13" fill="#A9BEDF">매머드 뼈 곤봉 · atk0 6,144</text></g>
</g>
<text x="80" y="660" font-family="IBM Plex Sans KR, sans-serif" font-size="14" fill="#5B6B85">원본(핵심 캐릭터) 원화는 사람이 그린다. 이 실루엣은 슬롯 구조를 보여주는 컨셉 자리표시자이며, 무기·이름은 (가정)이다.</text>
</svg>
